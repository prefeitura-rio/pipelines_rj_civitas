        - name: chat_id
        - name: datetime
        - name: city
        - name: transcript
        - name: transcript_sentiment
        - name: c_radio_id
        - name: c_radio_name
        - name: c_program_title
        - name: media_path
        - name: tags
        - name: is_relevant
        - name: locations
        - name: main_location
        - name: main_location_city
        - name: main_location_neighborhood
        - name: main_location_street
        - name: main_location_full_address
        - name: latitude
        - name: longitude
        - name: timestamp_insercao

      - name: palver_television_messages
        columns:
        - name: id
        - name: chat_id
        - name: datetime
        - name: city
        - name: transcript
        - name: transcript_sentiment
        - name: c_channel_id
        - name: c_channel_name
        - name: program_title
