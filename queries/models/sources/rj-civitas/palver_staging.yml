version: 2

sources:
  - name: palver_staging
    database: >
      {% if target.name == 'staging' %}
      rj-civitas-dev
      {% else %}
      rj-civitas
      {% endif %}
    schema: palver_staging
    tables:
      - name: palver_news_messages
        columns:
        - name: id
        - name: chat_id
        - name: datetime
        - name: datetime_search
        - name: text
        - name: c_title_search
        - name: c_subtitle_search
        - name: c_url
        - name: ca_authors
        - name: tags
        - name: is_relevant
        - name: locations
        - name: main_location
        - name: main_location_city
        - name: main_location_neighborhood
        - name: main_location_street
        - name: main_location_full_address
        - name: latitude
        - name: longitude
        - name: timestamp_insercao

      - name: palver_press_messages
        columns:
        - name: id
        - name: chat_id
        - name: datetime
        - name: c_processed_at
        - name: text
        - name: c_title_search
        - name: media_path
        - name: tags
        - name: is_relevant
        - name: locations
        - name: main_location
        - name: main_location_city
        - name: main_location_neighborhood
        - name: main_location_street
        - name: main_location_full_address
        - name: latitude
        - name: longitude
        - name: timestamp_insercao

      - name: palver_radio_medias_messages
        columns:
