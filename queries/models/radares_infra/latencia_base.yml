version: 2

models:
  - name: latencia_base
    description: |
      **Descrição**: Esta tabela fornece os dados de latência para leituras de câmeras,
      calculadas com base no tempo de captura e no tempo registrado da leitura.
      **Frequência de Atualização**: Diária.
      **Publicado Por**: |
        Amanda Amaro
        Nicolas Evilasio
      **Publicado Por (email)**: |
        amanda.amaro@prefeitura.rio
        nicolas.evilasio@prefeitura.rio

    columns:
      - name: empresa
        description: "Empresa responsável pela câmera."

      - name: data
        description: "Data truncada para a hora mais próxima, fuso horário GTM-3."

      - name: datahora_captura
        description: "Data e hora da captura da leitura, no fuso horário GTM -3."

      - name: datahora
        description: "Data e hora da leitura, no fuso horário GTM -3."

      - name: latencia_segundos
        description: "Latência em segundos entre o tempo de captura e o tempo registrado da leitura."

      - name: max_datahora_captura
        description: "Data e hora da captura da leitura, no fuso horário GTM -3."

