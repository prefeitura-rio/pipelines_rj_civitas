version: 2

models:
  - name: int_indicador__resumo
    description: |
      Definição única dos principais indicadores da CIVITAS: placas monitoradas, casos apoiados
      e alertas enviados. Uma única linha.

      Compartilhado pelos marts `projeto_indicador__resumo` (BI) e
      `app_painel_indicador__resumo` (painel), que expõem estas métricas de forma independente.
      Mudanças aqui afetam os dois.

      Materialização: efêmera (não é criada no BigQuery).

      Origem: int_placa_monitorada__ativa, int_caso_apoiado__unificado,
      stg_cerco_digital__alerta_enviado, stg_app_civitas__ticket,
      stg_app_civitas__placa_monitorada, stg_app_civitas__placa_monitorada_vinculo
      Publicado por: Nicolas Evilasio
      Publicado por (email): nicolas.evilasio@prefeitura.rio
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 1
    columns:
      - name: placa_monitorada_quantidade
        description: |
          Quantidade de placas monitoradas no momento da consulta.

          {{ doc("regra_placa_monitorada_ativa") }}
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: caso_apoiado_quantidade
        description: |
          Quantidade de casos apoiados pela CIVITAS desde 2024-06-01.

          {{ doc("regra_caso_apoiado") }}
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: alerta_enviado_quantidade
        description: |
          Quantidade de alertas de passagem de veículo monitorado enviados aos solicitantes
          desde o início das operações. Origem: `stg_cerco_digital__alerta_enviado`.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: carga_datahora
        description: |
          Data e hora (UTC) da carga mais recente do Airbyte entre os dados do sistema CIVITAS
          usados no resumo (ticket, placa monitorada e vínculo). A replicação é por CDC: a data
          só avança quando algum desses dados tem uma alteração, então um valor antigo não
          indica, sozinho, falha na sincronização.
