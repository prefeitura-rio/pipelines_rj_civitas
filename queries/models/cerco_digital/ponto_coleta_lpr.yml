version: 2

models:
  - name: ponto_coleta_lpr
    description: |
      Tabela que consolida e normaliza os dados dos pontos de coleta da CETRIO e CIVITAS.

      Publicado por: Nicolas Evilasio
      Publicado por (email): nicolas.evilasio@prefeitura.rio

    columns:
      - name: id_ponto_coleta
        description: "Código identificador do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__id_ponto_coleta__not_null
              meta:
                description: "Verifica se id_ponto_coleta não é nula."

      - name: origem_equipamento
        description: "Origem do equipamento."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__origem_equipamento__not_null
              meta:
                description: "Verifica se origem_equipamento não é nula."

      - name: codigo_ponto_coleta
        description: "Código do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__codigo_ponto_coleta__not_null
              meta:
                description: "Verifica se codigo_ponto_coleta não é nula."

      - name: local
        description: "Local do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__local__not_null
              meta:
                description: "Verifica se local não é nula."

      - name: bairro
        description: "Bairro do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__bairro__not_null
              meta:
                description: "Verifica se bairro não é nula."

      - name: sentido
        description: "Sentido do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__sentido__not_null
              meta:
                description: "Verifica se sentido não é nula."

      - name: latitude
        description: "Latitude do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__latitude__not_null
              meta:
                description: "Verifica se latitude não é nula."

      - name: longitude
        description: "Longitude do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__longitude__not_null
              meta:
                description: "Verifica se longitude não é nula."

      - name: status_ativo
        description: "Status ativo do ponto de coleta."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              name: ponto_coleta_lpr__status_ativo__not_null
              meta:
                description: "Verifica se status_ativo não é nula."